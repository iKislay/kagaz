# Kagaz all-in-one DEMO stack: postgres + seaweedfs (S3) + migrations + api + web.
# For a single demo VM or a laptop rehearsal — NOT production (no TLS, local storage, DEMO payments).
#
#   cp infra/demo.env.example infra/demo.env   # then fill in real random secrets
#   docker compose -f infra/docker-compose.demo.yml --env-file infra/demo.env up -d --build
#
# Release order is enforced: postgres healthy → `migrate` (prisma migrate deploy) exits 0 → api.
# Browsers upload/download PDFs DIRECTLY to S3 with signed URLs, so S3_ENDPOINT must be reachable
# from the browser AND from the api container: use the VM's public host name / IP
# (default host.docker.internal works with Docker Desktop on the same machine).
name: ${COMPOSE_PROJECT_NAME:-kagaz-demo}

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-demo}
  API_PORT: '4000'
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://kagaz:${POSTGRES_PASSWORD:-kagaz}@postgres:5432/kagaz
  S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
  S3_REGION: auto
  S3_BUCKET: ${S3_BUCKET:-kagaz-demo}
  S3_FORCE_PATH_STYLE: 'true'
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-kagaz-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-kagaz-local-secret}
  PAYMENT_PROVIDER: demo # the API refuses to start with this when APP_ENV=production
  OTP_PROVIDER: demo
  DEMO_WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:?set DEMO_WEBHOOK_SECRET}
  SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET (32+ random chars)}
  PICKUP_CODE_PEPPER: ${PICKUP_CODE_PEPPER:?set PICKUP_CODE_PEPPER (32+ random chars)}
  PICKUP_CODE_ENC_KEY: ${PICKUP_CODE_ENC_KEY:?set PICKUP_CODE_ENC_KEY (32 bytes base64)}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kagaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kagaz}
      POSTGRES_DB: kagaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kagaz -d kagaz']
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=128
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_HOST_PORT:-9000}:8333'
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  storage-init:
    image: amazon/aws-cli:2.39.2
    depends_on: [seaweedfs]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-kagaz-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-kagaz-local-secret}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${S3_BUCKET:-kagaz-demo}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for i in $$(seq 1 60); do
          if aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null; then
            echo "bucket $$BUCKET ready (private)"; exit 0
          fi
          aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "$$BUCKET" >/dev/null 2>&1 || true
          sleep 2
        done
        echo 'storage-init: S3 API did not become ready' >&2; exit 1
    restart: 'no'

  # Release step: apply Prisma migrations once, before the API starts.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: kagaz-api-migrate:${IMAGE_TAG:-demo}
    environment:
      DATABASE_URL: postgresql://kagaz:${POSTGRES_PASSWORD:-kagaz}@postgres:5432/kagaz
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: kagaz-api:${IMAGE_TAG:-demo}
    restart: unless-stopped
    environment: *api-env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    image: kagaz-web:${IMAGE_TAG:-demo}
    restart: unless-stopped
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
