# Local development infrastructure for Kagaz.
# Postgres = source of truth; SeaweedFS = S3-compatible private object storage (R2/S3 in cloud envs).
# MinIO was the original choice, but its community images are no longer published.
name: kagaz

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kagaz
      POSTGRES_PASSWORD: kagaz
      POSTGRES_DB: kagaz
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kagaz -d kagaz']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 API on host port 9000 (container 8333). Only the identity in seaweedfs/s3.json can
  # access buckets; there is no anonymous identity, so every bucket is private.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=128
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '9000:8333'
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot: waits for the S3 API, then creates the private bucket (idempotent).
  storage-init:
    image: amazon/aws-cli:2.39.2
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: kagaz-local
      AWS_SECRET_ACCESS_KEY: kagaz-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for i in $$(seq 1 60); do
          if aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket kagaz-local 2>/dev/null; then
            echo 'bucket kagaz-local ready (private)'; exit 0
          fi
          aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket kagaz-local >/dev/null 2>&1 || true
          sleep 2
        done
        echo 'storage-init: S3 API did not become ready' >&2; exit 1
    restart: 'no'

volumes:
  pgdata:
  seaweeddata:
