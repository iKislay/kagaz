# Local development infrastructure for Kagaz.
# Postgres = source of truth; MinIO = S3-compatible private object storage (R2/S3 in cloud envs).
name: kagaz

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kagaz
      POSTGRES_PASSWORD: kagaz
      POSTGRES_DB: kagaz
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kagaz -d kagaz']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Pinned: MinIO no longer publishes new community images; this release is sufficient for local S3.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kagaz-local
      MINIO_ROOT_PASSWORD: kagaz-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the private bucket. Anonymous access stays disabled (private by default).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kagaz-local kagaz-local-secret &&
      mc mb --ignore-existing local/kagaz-local &&
      mc anonymous set none local/kagaz-local &&
      echo 'bucket kagaz-local ready (private)'
      "
    restart: 'no'

volumes:
  pgdata:
  miniodata:
